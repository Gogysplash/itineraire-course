<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Itinéraire de course</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Carte plein écran, panneau flottant arrondi en bas */
  :root { --bg: rgba(255,255,255,.94); --fg: #14161a; --sub: #6b7280; --chip: #eceef2;
          --accent: #ff4d2e; --primary: #14161a; --on-primary: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: rgba(24,26,31,.94); --fg: #f3f4f6; --sub: #9aa1ad; --chip: #2d3139;
            --primary: #f3f4f6; --on-primary: #14161a; }
  }
  html, body { height: 100%; margin: 0; font: 16px system-ui, sans-serif; color: var(--fg); }
  #map { position: absolute; inset: 0; background: #e9ecef; }
  #bar { position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
         max-width: 480px; margin: 0 auto; padding: 18px 16px 16px; border-radius: 26px; display: grid; gap: 12px;
         background: var(--bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
         box-shadow: 0 10px 34px rgba(0,0,0,.2); }
  #lbl { font-size: .78rem; font-weight: 600; color: var(--sub); letter-spacing: .06em; text-transform: uppercase; }
  #km { display: block; font-size: 2.6rem; font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
        font-variant-numeric: tabular-nums; }
  #km::after { content: ' km'; font-size: 1rem; font-weight: 600; letter-spacing: 0; color: var(--sub); }
  #tools { display: flex; gap: 8px; }
  #tools button { flex: 1; }
  button { min-height: 48px; padding: 0 12px; border: 0; border-radius: 999px; font: inherit; font-weight: 600;
           background: var(--chip); color: var(--fg); transition: transform .1s; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #go { min-height: 56px; font-size: 1.05rem; font-weight: 700; background: var(--primary); color: var(--on-primary); }
  #go.stop { background: var(--accent); color: #fff; }
  #here { position: absolute; right: 0; top: -64px; width: 52px; height: 52px; padding: 0; display: grid; place-items: center;
          background: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  #msg { margin: 0; font-size: .85rem; font-weight: 600; color: var(--accent); }
  #msg:empty { display: none; }
  [hidden] { display: none !important; }
  .leaflet-top { margin-top: env(safe-area-inset-top); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <button id="here" aria-label="Ma position">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </button>
  <div>
    <div id="lbl"></div>
    <output id="km" aria-live="polite">0,00</output>
  </div>
  <p id="msg" role="status"></p>
  <div id="tools">
    <button id="undo">Annuler</button>
    <button id="loop">Boucler</button>
    <button id="clear">Effacer</button>
  </div>
  <button id="go">Démarrer</button>
</div>
<script>
const $ = id => document.getElementById(id);
let saved = {};
try { saved = JSON.parse(localStorage.getItem('run')) || {}; } catch {}

// Un tronçon par point touché : p = le point, path = le tracé depuis le point précédent, d = mètres
let legs = saved.legs || [];

const map = L.map('map', { zoomControl: false }).setView(saved.center || [46.6, 2.4], saved.zoom || 6);
map.attributionControl.setPosition('topright'); // le panneau du bas la cacherait
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
const ACCENT = '#ff4d2e';
const casing = L.polyline([], { color: '#fff', weight: 10 }).addTo(map); // liseré blanc sous le tracé
const line = L.polyline([], { color: ACCENT, weight: 6 }).addTo(map);
const dots = L.layerGroup().addTo(map);

function save() {
  try { localStorage.setItem('run', JSON.stringify({ legs, center: map.getCenter(), zoom: map.getZoom() })); } catch {}
}

function draw() {
  const path = legs.flatMap(l => l.path);
  casing.setLatLngs(path);
  line.setLatLngs(path);
  dots.clearLayers();
  legs.forEach((l, i) => L.circleMarker(l.p, { radius: i ? 5 : 9, weight: 3, fillOpacity: 1, interactive: false,
    color: i ? ACCENT : '#fff', fillColor: i ? '#fff' : '#16a34a' }).addTo(dots));
  show();
  save();
}

// Phase tracé : longueur du parcours. Phase course : distance courue / longueur du parcours.
const fmt = m => (m / 1000).toFixed(2).replace('.', ',');
function show() {
  const total = legs.reduce((s, l) => s + l.d, 0);
  $('km').textContent = fmt(running ? ran : total);
  $('lbl').textContent = running ? 'Couru · sur ' + fmt(total) + ' km'
    : legs.length ? 'Parcours' : 'Touche la carte pour tracer';
}

async function add(p) {
  $('msg').textContent = '';
  const prev = legs.at(-1);
  let leg = { p, path: [p], d: 0 };
  if (prev) {
    try {
      const r = await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
        `${prev.p[1]},${prev.p[0]};${p[1]},${p[0]}?overview=full&geometries=geojson`);
      const route = (await r.json()).routes[0];
      const path = route.geometry.coordinates.map(c => [c[1], c[0]]);
      leg = { p: path.at(-1), path, d: route.distance };
    } catch {
      leg = { p, path: [prev.p, p], d: map.distance(prev.p, p) };
      $('msg').textContent = 'Calcul du chemin indisponible : tronçon tracé en ligne droite.';
    }
  }
  legs.push(leg);
  draw();
}

// File d'attente : les touches rapides s'enchaînent dans l'ordre au lieu de se croiser
let q = Promise.resolve();
const then = f => { q = q.then(f); };

map.on('click', e => { if (!running) then(() => add([e.latlng.lat, e.latlng.lng])); });
map.on('moveend', save);
map.on('locationerror', () => { $('msg').textContent = 'Position indisponible (autorisez la localisation).'; });
$('undo').onclick = () => then(() => { legs.pop(); draw(); });
$('loop').onclick = () => then(() => legs.length > 1 && add(legs[0].p));
$('clear').onclick = () => then(() => { legs = []; draw(); });

// Deux phases : tracé (running = false, on touche la carte pour poser des points)
// et course (running = true, la carte est verrouillée et suit la position).
const cap = window.Capacitor?.nativeCallback && window.Capacitor; // présent seulement dans l'application Android
const walked = L.polyline([], { color: '#1a73e8', weight: 4, opacity: .8 }).addTo(map); // chemin réellement parcouru
let running = false, ran = 0, me, center = false, off = false, watchId = null, denied = false, searching = false, lock;

// Distance en mètres entre une position et le parcours tracé
function offRoute(ll) {
  const P = x => L.CRS.EPSG3857.project(L.latLng(x)), p = P(ll), pts = legs.flatMap(l => l.path).map(P);
  let d = Infinity;
  for (let i = 1; i < pts.length; i++) d = Math.min(d, L.LineUtil.pointToSegmentDistance(p, pts[i - 1], pts[i]));
  return d * Math.cos(ll.lat * Math.PI / 180); // Mercator étire les distances de 1/cos(latitude)
}

function seen(ll) {
  if (searching) { searching = false; $('msg').textContent = ''; }
  me = me || L.circleMarker(ll,
    { radius: 9, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(map);
  me.setLatLng(ll);
  if (center || running) { center = false; map.setView(ll, Math.max(map.getZoom(), 16)); }
  if (!running) return;
  const prev = walked.getLatLngs().at(-1);
  if (prev) ran += map.distance(prev, ll);
  walked.addLatLng(ll);
  show();
  const far = legs.length > 1 && offRoute(ll) > 50;
  if (far && !off) cap?.nativePromise('LocalNotifications', 'schedule', { notifications: [
    { id: 1, title: 'Hors parcours', body: "Tu t'écartes de ton itinéraire." }] }).catch(() => {});
  off = far;
}
map.on('locationfound', e => seen(e.latlng));

function stopTrack() {
  if (!cap) return map.stopLocate();
  if (watchId) cap.nativePromise('BackgroundGeolocation', 'removeWatcher', { id: watchId }).catch(() => {});
  watchId = null;
}

function track() {
  center = true;
  stopTrack();
  if (!cap) return map.locate({ watch: true, enableHighAccuracy: true });
  searching = true;
  $('msg').textContent = 'Recherche du GPS…';
  const opts = { requestPermissions: true, stale: false, distanceFilter: 5 };
  // backgroundMessage = suivi écran éteint avec notification permanente : seulement pendant la course
  if (running) Object.assign(opts,
    { backgroundTitle: 'Itinéraire course', backgroundMessage: 'Suivi de ta course en cours.' });
  // Une demande d'autorisation à la fois : notifications (Android 13+), puis localisation
  (running ? cap.nativePromise('LocalNotifications', 'requestPermissions', {}).catch(() => {}) : Promise.resolve())
    .then(() => {
      watchId = cap.nativeCallback('BackgroundGeolocation', 'addWatcher', opts, (loc, err) => {
        if (err || !loc) {
          watchId = null; searching = false;
          const no = err?.code === 'NOT_AUTHORIZED';
          // refus répété : Android n'affiche plus la demande, on ouvre les réglages de l'application
          if (no && denied) cap.nativePromise('BackgroundGeolocation', 'openSettings', {}).catch(() => {});
          denied = no;
          $('msg').textContent = 'Position indisponible : ' + (no
            ? 'autorise la localisation, puis réessaie.'
            : (err?.message || err?.code || 'erreur inconnue'));
          return;
        }
        seen(L.latLng(loc.latitude, loc.longitude));
      });
    });
}
$('here').onclick = track;

$('go').onclick = () => {
  running = !running;
  $('tools').hidden = $('here').hidden = running;
  $('go').textContent = running ? 'Terminer' : 'Démarrer';
  $('go').classList.toggle('stop', running);
  if (running) {
    ran = 0; off = false; walked.setLatLngs([]);
    track();
    navigator.wakeLock?.request('screen').then(l => { lock = l; }).catch(() => {});
  } else {
    stopTrack();
    lock?.release().catch(() => {});
  }
  show();
};

// Version web : une page ne peut pas suivre écran éteint, on reprend dès qu'elle redevient visible.
document.addEventListener('visibilitychange', () => { if (!cap && !document.hidden && me) track(); });
if (cap) track();
else navigator.permissions?.query({ name: 'geolocation' })
  .then(s => { if (s.state === 'granted') track(); }).catch(() => {});

draw();
</script>
</body>
</html>
